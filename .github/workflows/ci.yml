name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  ts-typecheck:
    name: TS type-check (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/src/main/ts/pnpm-lock.yaml

      - name: Install deps + tsc --noEmit
        working-directory: app/src/main/ts
        run: |
          pnpm install --no-frozen-lockfile
          node node_modules/typescript/bin/tsc --noEmit
